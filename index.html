<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Darts Scorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Darts Scorer (501)</h1>
        
        <div class="turn-indicator">
            <h2 id="turn-display">Player 1's Turn</h2>
        </div>

        <div class="match-grid">
            <div class="player-card active" id="p1-card">
                <h3>Player 1</h3>
                <div class="score" id="p1-score">501</div>
            </div>
            <div class="player-card" id="p2-card">
                <h3>Player 2</h3>
                <div class="score" id="p2-score">501</div>
            </div>
        </div>

        <div class="input-area">
            <input type="number" id="turn-score" placeholder="3-dart score" min="0" max="180">
            <button onclick="submitTurn()">Submit</button>
        </div>

        <div class="history-section">
            <h3>Match Log</h3>
            <ul id="score-history"></ul>
        </div>

        <button onclick="resetGame()" class="btn-reset">Reset Match</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
